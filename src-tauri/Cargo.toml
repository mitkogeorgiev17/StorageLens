[package]
name = "storagelens-app"
description = "StorageLens desktop shell (Tauri 2)."
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["Mitko <mgeorgiev317@gmail.com>"]
repository = "https://github.com/mitkogeorgiev17/StorageLens"

# Own workspace: this crate embeds the built frontend, so it must not be pulled into
# the root `cargo build --workspace` on a checkout without `ui/dist`.
[workspace]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
