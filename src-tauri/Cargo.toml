[package]
name = "storagelens-app"
description = "StorageLens desktop shell (Tauri 2)."
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["Mitko <mgeorgiev317@gmail.com>"]
repository = "https://github.com/mitkogeorgiev17/StorageLens"

# Own workspace: this crate embeds the built frontend, so it must not be pulled into
# the root `cargo build --workspace` on a checkout without `ui/dist`.
[workspace]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
# Native folder chooser for the scan picker (#72). Only `dialog:allow-open`
# is granted (capabilities/default.json).
tauri-plugin-dialog = "=2.8.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
# The workspace crates the commands wrap. Path dependencies: src-tauri is its own
# Cargo workspace so it can embed the built frontend (AGENTS.md §4).
storagelens-core = { path = "../crates/core" }
storagelens-catalog = { path = "../crates/catalog" }
storagelens-analysis = { path = "../crates/analysis" }
storagelens-safety = { path = "../crates/safety" }

[target.'cfg(target_os = "macos")'.dependencies]
storagelens-scan-macos = { path = "../crates/scan-macos" }

[target.'cfg(windows)'.dependencies]
storagelens-scan-windows = { path = "../crates/scan-windows" }

[dev-dependencies]
tempfile = "=3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
