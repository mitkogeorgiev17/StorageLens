[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/catalog",
    "crates/scan-macos",
    "crates/scan-windows",
    "crates/analysis",
    "crates/safety",
    "crates/scanbench",
]
# `src-tauri` is deliberately its own workspace. Building it embeds the compiled
# frontend, so it requires `npm run build` first. Keeping it out of this workspace
# means `cargo build --workspace` succeeds from a clean checkout with no frontend.
exclude = ["src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["Mitko <mgeorgiev317@gmail.com>"]
repository = "https://github.com/mitkogeorgiev17/StorageLens"

[workspace.dependencies]
# Internal crates — path deps so every member resolves the same source.
storagelens-core = { path = "crates/core" }
storagelens-catalog = { path = "crates/catalog" }
storagelens-scan-macos = { path = "crates/scan-macos" }
storagelens-scan-windows = { path = "crates/scan-windows" }
storagelens-analysis = { path = "crates/analysis" }
storagelens-safety = { path = "crates/safety" }

# External crates — exact versions, declared once. Bump them here, never per crate.
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
rusqlite = { version = "=0.41.1", features = ["bundled"] }
rayon = "=1.12.0"
blake3 = "=1.8.7"
trash = "=5.2.9"
notify = "=8.2.1"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
clap = { version = "=4.6.7", features = ["derive"] }
memory-stats = "=1.2.0"
tempfile = "=3.27.0"
libc = "=0.2.191"
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
