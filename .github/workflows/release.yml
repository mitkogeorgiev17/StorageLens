# Release builds (#179). Runs ONLY when a version tag is pushed (or by hand
# from the Actions tab for a test build). There is no per-push CI: the Actions
# quota is shared, and macOS minutes count 10x. Merges are gated on the local
# suite (AGENTS.md §4).
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# The tag must match "version" in src-tauri/tauri.conf.json. Files keep stable
# names, so the README can link to releases/latest/download/<name>.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch: # a test build: uploads artifacts, publishes nothing

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            name: macos
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match tauri.conf.json version $version"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust targets
        shell: bash
        run: |
          if [ "${{ matrix.name }}" = macos ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
          fi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ${{ matrix.name }}

      - run: npm ci

      - name: Build (macOS, universal .dmg)
        if: matrix.name == 'macos'
        run: |
          npx tauri build --target universal-apple-darwin --bundles dmg
          mkdir dist-release
          cp target/universal-apple-darwin/release/bundle/dmg/*.dmg dist-release/StorageLens.dmg

      - name: Build (Windows, installer + portable .exe)
        if: matrix.name == 'windows'
        shell: bash
        run: |
          npx tauri build --bundles nsis
          mkdir dist-release
          cp target/release/bundle/nsis/*-setup.exe dist-release/StorageLens-setup.exe
          cp target/release/storagelens-app.exe dist-release/StorageLens-portable.exe

      - uses: actions/upload-artifact@v4
        with:
          name: storagelens-${{ matrix.name }}
          path: dist-release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l files
          gh release create "$GITHUB_REF_NAME" files/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "StorageLens $GITHUB_REF_NAME" \
            --generate-notes
