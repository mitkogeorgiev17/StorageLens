[package]
name = "storagelens-scan-macos"
description = "macOS storage scanner built on getattrlistbulk(2)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
storagelens-core = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
libc = { workspace = true }
rayon = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# The fixture generator is the oracle for `tests/fixture_stat.rs`; the feature is
# off in normal builds so it never ships.
storagelens-core = { workspace = true, features = ["fixtures"] }
