[package]
name = "storagelens-safety"
description = "Path guards, trash service, deletion manifests, and undo."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
storagelens-core = { workspace = true }
storagelens-catalog = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
trash = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

# Tests re-stat real temp files with the platform's own `stamp`.
[target.'cfg(target_os = "macos")'.dev-dependencies]
storagelens-scan-macos = { workspace = true }

[target.'cfg(windows)'.dev-dependencies]
storagelens-scan-windows = { workspace = true }

[lints.rust]
# Set by cargo-llvm-cov on nightly, to exclude the real-Trash call.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage_nightly)"] }
