[package]
name = "storagelens-scanbench"
description = "CLI harness that measures scanner correctness and speed."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "scanbench"
path = "src/main.rs"

[dependencies]
# The fixture generator is part of `scanbench --fixtures`, so it is a real
# (not dev-only) dependency of this binary.
storagelens-core = { workspace = true, features = ["fixtures"] }
storagelens-catalog = { workspace = true }
storagelens-scan-macos = { workspace = true }
storagelens-scan-windows = { workspace = true }
storagelens-analysis = { workspace = true }
storagelens-safety = { workspace = true }
clap = { workspace = true }
memory-stats = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# `tests/accuracy_windows.rs` cross-checks allocated bytes with a per-file Win32
# query. Already a workspace dependency (via scan-windows); test-only here.
[target.'cfg(windows)'.dev-dependencies]
windows = { workspace = true }
